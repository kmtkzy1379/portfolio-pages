<!doctype html>
<html lang="ja" data-theme="dark" data-anim="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小松 主弥 ＿記録書｜ポートフォリオ</title>
<meta name="description" content="小松 主弥のポートフォリオ。AIプロダクトの企画・PdMを志す学生の作品・活動履歴。">
<meta name="color-scheme" content="dark light">
<!-- ドット絵のファビコン（PromptLoreのアイコンとは別に、このサイト用に生成） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9' shape-rendering='crispEdges'%3E%3Crect width='9' height='9' fill='black'/%3E%3Cg fill='white'%3E%3Crect x='2' y='1' width='1' height='7'/%3E%3Crect x='6' y='1' width='1' height='1'/%3E%3Crect x='5' y='2' width='1' height='1'/%3E%3Crect x='4' y='3' width='1' height='1'/%3E%3Crect x='3' y='4' width='1' height='1'/%3E%3Crect x='4' y='5' width='1' height='1'/%3E%3Crect x='5' y='6' width='1' height='1'/%3E%3Crect x='6' y='7' width='1' height='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="crt" id="crt">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- ================= ローディング / タイトル ================= -->
  <section class="boot" id="boot">
    <div class="boot__inner">
      <div class="boot__logo" aria-hidden="true">
        <span>KOMATSU</span>
        <b>SYSTEM</b>
      </div>

      <div class="boot__log" id="bootLog" role="status" aria-live="polite"></div>

      <div class="boot__barwrap" aria-hidden="true">
        <div class="boot__bar"><span id="bootBar"></span></div>
        <div class="boot__pct" id="bootPct">0%</div>
      </div>

      <!-- サイトカウンター -->
      <div class="counter" id="counter" hidden>
        <div class="counter__label">そう アクセスすう</div>
        <div class="counter__digits" id="counterDigits" aria-label="総アクセス数カウンター"></div>
        <div class="counter__plus" id="counterPlus">＋1</div>
        <div class="counter__you" id="counterYou">これまでの そうアクセス <b id="counterOrd">?</b> かい</div>
      </div>

      <button class="boot__press" id="bootPress" hidden>
        ▼ PRESS ANY KEY / タップして はじめる
      </button>
    </div>
  </section>

  <!-- ================= 本編 ================= -->
  <div class="app" id="app" hidden>

    <!-- HUD -->
    <header class="hud" id="hud">
      <button class="hud__back" id="hudBack" hidden>◀ もどる</button>
      <div class="hud__gauge">
        <div class="hud__row">
          <span class="hud__lv">LV <b id="hudLv">1</b></span>
          <span class="hud__exp" id="hudExp">0 / 0</span>
        </div>
        <div class="gauge"><span id="gaugeFill"></span></div>
      </div>
      <button class="hud__icon" id="hudLog" title="小松の記憶（閲覧の記録）" aria-label="閲覧の記録を見る">記</button>
      <button class="hud__icon hud__sound" id="hudSound" title="SE切り替え" aria-label="効果音の切り替え">♪</button>
    </header>

    <main class="view" id="view"></main>

    <footer class="foot" id="foot"></footer>
  </div>

  <!-- ================= 演出レイヤー ================= -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas class="fx" id="fx" hidden></canvas>

  <!-- マスター称号（隠しメッセージ） -->
  <div class="master" id="master" hidden>
    <div class="master__inner">
      <div class="master__star" aria-hidden="true">★</div>
      <h2 class="master__title">★ ぜんこうもく かんりょう ★</h2>
      <div class="win master__win">
        <p id="masterText"></p>
      </div>
      <div class="master__medal">
        <div class="master__medalIn">
          <div class="master__medalLabel">しょうごう</div>
          <div class="master__medalName">小松マスター</div>
        </div>
      </div>
      <button class="btn" id="masterClose">とじる</button>
    </div>
  </div>

  <!-- ================= おとも（画面端のドット絵キャラ） =================
       フレーム画像は初回表示のときに JS が流し込む（未表示なら通信ゼロ） -->
  <div class="mascot" id="mascot" hidden>
    <span class="mascot__hint" id="mascotHint" hidden>クリック！</span>
    <button class="mascot__btn" id="mascotBtn" type="button" disabled
            aria-label="おとも を なかまにする"></button>
  </div>

</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
